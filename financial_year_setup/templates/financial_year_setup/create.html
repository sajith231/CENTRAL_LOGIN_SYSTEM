{% extends "base.html" %}
{% block title %}New Financial year{% endblock %}
{% block header_title %}New Financial year{% endblock %}
{% block content %}
<style>.fy-field select option{color:#0f172a;background:#fff}</style>
<style>
.fy-page{max-width:850px;margin:auto}.fy-card{background:#111827;border:1px solid rgba(148,163,184,.15);border-radius:16px;padding:26px;box-shadow:0 12px 28px rgba(0,0,0,.16)}.fy-card h1{margin:0;color:#f8fafc;font-size:26px}.fy-card p{color:#94a3b8;font-size:14px}.fy-form{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.fy-field{display:flex;flex-direction:column;gap:7px}.fy-field.full{grid-column:1/-1}.fy-field label{color:#cbd5e1;font-size:13px;font-weight:600}.fy-field input,.fy-field select,.fy-field textarea{width:100%;box-sizing:border-box;background:#f8fafc;color:#0f172a;border:1px solid #64748b;border-radius:8px;padding:11px 12px;font:inherit;font-size:14px}.fy-field textarea{min-height:90px;resize:vertical}.fy-field input:focus,.fy-field select:focus,.fy-field textarea:focus{outline:none;border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}.fy-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:6px}.fy-btn{border-radius:9px;padding:11px 16px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}.fy-save{border:0;color:#fff;background:linear-gradient(135deg,#2563eb,#4f46e5)}.fy-cancel{border:1px solid #475569;color:#cbd5e1;background:#1e293b}@media(max-width:600px){.fy-form{grid-template-columns:1fr}.fy-field.full,.fy-actions{grid-column:auto}.fy-actions{flex-direction:column}.fy-actions .fy-btn{width:100%;text-align:center}}
</style>
<div class="fy-page"><div class="fy-card"><h1>New Financial year</h1><p>Create a country-wise financial year configuration in the central service.</p><form method="post" class="fy-form" action="{% url 'financial_year_setup:create' %}">{% csrf_token %}<div class="fy-field"><label for="country_name">Country name</label><input id="country_name" name="country_name" required placeholder="e.g. India"></div><div class="fy-field"><label for="country_code">Country code</label><input id="country_code" name="country_code" required maxlength="3" placeholder="e.g. IN" style="text-transform:uppercase"></div><div class="fy-field"><label for="fy_from_month">Financial year starts</label><select id="fy_from_month" name="fy_from_month" required>{% for month in months %}<option value="{{ month }}">{{ month }}</option>{% endfor %}</select></div><div class="fy-field"><label for="fy_to_month">Financial year ends</label><select id="fy_to_month" name="fy_to_month" required>{% for month in months %}<option value="{{ month }}"{% if month == 'MARCH' %} selected{% endif %}>{{ month }}</option>{% endfor %}</select></div><div class="fy-field full"><label for="remark">Remark</label><textarea id="remark" name="remark" placeholder="Optional remark"></textarea></div><div class="fy-actions"><a class="fy-btn fy-cancel" href="{% url 'financial_year_setup:setup' %}">Cancel</a><button class="fy-btn fy-save" type="submit"><i class="fa-solid fa-plus"></i> Create financial year</button></div></form></div></div>
{% endblock %}
